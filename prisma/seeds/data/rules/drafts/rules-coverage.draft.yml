schemaVersion: 1
status: draft
purpose: 'Coverage-first inventory for rule-driven mission/challenge progress'

ruleTemplate:
  window:
    type: since_start
    days: 7
  counters: {}
  target: 'false'
  progress: '0'
  notes:
    - 'TODO: map to concrete EventType counters'
    - 'TODO: replace placeholder target/progress expressions'

missions:
  - code: M.A1.1
    shape: bounded_max_with_fail
    rule:
      window:
        type: since_start
        days: 7
      counters:
        meatMeals:
          event: MEAL_MEAT_CONSUMED
          distinctBy: metadata.mealId
      target: 'meatMeals <= 4'
      fail: 'meatMeals > 4'
      resolveAt: window_end
      progress: 'max(0, min(1 - (meatMeals / 5), 1))'
      notes:
        - 'Interprets mission as: stay at or below 4 meat meals for the window'
  - code: M.A1.2
    shape: ratio_majority
    rule:
      window:
        type: since_start
        days: 7
      counters:
        plantProteinMeals:
          event: MEAL_LEGUME_CONSUMED
          distinctBy: metadata.mealId
        meatMeals:
          event: MEAL_MEAT_CONSUMED
          distinctBy: metadata.mealId
      target: 'plantProteinMeals > meatMeals && (plantProteinMeals + meatMeals) >= 5'
      progress: 'min(plantProteinMeals / max(plantProteinMeals + meatMeals, 1), 1)'
      notes:
        - 'Proxy for non-meat protein majority using currently available event types'
        - 'May need additional non-meat protein events beyond legumes'
  - code: M.A1.3
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        legumeMeals:
          event: MEAL_LEGUME_CONSUMED
          distinctBy: metadata.mealId
      target: 'legumeMeals >= 5'
      progress: 'min(legumeMeals / 5, 1)'
      notes:
        - 'Direct mapping from mission goal'
  - code: M.A1.4
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        alternativeStapleMeals:
          event: MEAL_ALTERNATIVE_STAPLE
          distinctBy: metadata.mealId
      target: 'alternativeStapleMeals >= 5'
      progress: 'min(alternativeStapleMeals / 5, 1)'
      notes:
        - 'Direct mapping from mission goal'
  - code: M.A1.5
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        sustainablePlateMeals:
          event: MEAL_SUSTAINABLE_PLATE
          distinctBy: metadata.mealId
      target: 'sustainablePlateMeals >= 10'
      progress: 'min(sustainablePlateMeals / 10, 1)'
      notes:
        - 'Depends on consistent emission of MEAL_SUSTAINABLE_PLATE'
  - code: M.A2.1
    shape: composite_threshold
    rule:
      window:
        type: since_start
        days: 7
      counters:
        originChecks:
          event: SHOPPING_ORIGIN_CHECKED
          distinctBy: metadata.mealId
        multiCriteriaPurchases:
          event: SHOPPING_MULTICRITERIA_PURCHASE
          distinctBy: metadata.mealId
      target: 'originChecks >= 3 && multiCriteriaPurchases >= 3'
      progress: '(min(originChecks / 3, 1) + min(multiCriteriaPurchases / 3, 1)) / 2'
      notes:
        - 'Approximates: origin plus one additional indicator for at least 3 meal decisions'
        - 'Assumes SHOPPING_MULTICRITERIA_PURCHASE means at least two criteria were considered'
  - code: M.A2.2
    shape: one_shot_event
    rule:
      window:
        type: since_start
        days: 7
      counters:
        certificationChoices:
          event: SHOPPING_CERTIFICATION_CHOSEN
      target: 'certificationChoices >= 1'
      progress: 'min(certificationChoices, 1)'
      notes:
        - 'Tracks selecting a certified product'
        - 'Current event model does not prove two distinct labels or recorded label meanings'
  - code: M.A2.3
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        multiCriteriaPurchases:
          event: SHOPPING_MULTICRITERIA_PURCHASE
          distinctBy: metadata.productId
      target: 'multiCriteriaPurchases >= 3'
      progress: 'min(multiCriteriaPurchases / 3, 1)'
      notes:
        - 'Direct mapping for at least 3 purchase decisions with multiple environmental dimensions'
  - code: M.A2.4
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        seasonalChoices:
          event: SHOPPING_SEASONAL_CHOSEN
          distinctBy: metadata.mealId
      target: 'seasonalChoices >= 4'
      progress: 'min(seasonalChoices / 4, 1)'
      notes:
        - 'Tracks seasonal product inclusion frequency'
        - 'Reason capture is not represented in current event metadata'
  - code: M.A2.5
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        informedChoices:
          event: SHOPPING_MULTICRITERIA_PURCHASE
          distinctBy: metadata.productId
      target: 'informedChoices >= 4'
      progress: 'min(informedChoices / 4, 1)'
      notes:
        - 'Maps to repeated multi-factor decision making across food choices'
        - 'Exact three-aspect threshold must be enforced at event emission time'
  - code: M.A3.1
    shape: composite_threshold
    rule:
      window:
        type: since_start
        days: 7
      counters:
        novaChecks:
          event: PROCESSING_NOVA_CHECKED
          distinctBy: metadata.productId
        greenScoreChecks:
          event: PROCESSING_GREENSCORE_CHECKED
          distinctBy: metadata.productId
      target: 'novaChecks >= 3 && greenScoreChecks >= 3'
      progress: '(min(novaChecks / 3, 1) + min(greenScoreChecks / 3, 1)) / 2'
      notes:
        - 'Maps to at least three purchases with both NOVA and Green-Score considered'
  - code: M.A3.2
    shape: composite_threshold
    rule:
      window:
        type: since_start
        days: 7
      counters:
        indicatorComparisons:
          event: PROCESSING_INDICATORS_COMPARED
          distinctBy: metadata.productId
        novaChecks:
          event: PROCESSING_NOVA_CHECKED
          distinctBy: metadata.productId
        greenScoreChecks:
          event: PROCESSING_GREENSCORE_CHECKED
          distinctBy: metadata.productId
      target: 'indicatorComparisons >= 3 && novaChecks >= 3 && greenScoreChecks >= 3'
      progress: '(min(indicatorComparisons / 3, 1) + min(novaChecks / 3, 1) + min(greenScoreChecks / 3, 1)) / 3'
      notes:
        - 'Uses indicator-comparison event as proxy for tri-indicator evaluation'
        - 'Nutri-Score has no dedicated event type in current catalog'
  - code: M.A3.3
    shape: composite_threshold
    rule:
      window:
        type: since_start
        days: 7
      counters:
        novaChecks:
          event: PROCESSING_NOVA_CHECKED
          distinctBy: metadata.productId
        ingredientReviews:
          event: PROCESSING_INGREDIENTS_REVIEWED
          distinctBy: metadata.productId
        packagingChecks:
          event: SHOPPING_PACKAGING_INFO_CHECKED
          distinctBy: metadata.productId
      target: 'novaChecks >= 3 && ingredientReviews >= 3 && packagingChecks >= 3'
      progress: '(min(novaChecks / 3, 1) + min(ingredientReviews / 3, 1) + min(packagingChecks / 3, 1)) / 3'
      notes:
        - 'Approximates identifying trade-offs across three foods with multiple evidence sources'
  - code: M.A3.4
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        indicatorComparisons:
          event: PROCESSING_INDICATORS_COMPARED
          distinctBy: metadata.productId
      target: 'indicatorComparisons >= 3'
      progress: 'min(indicatorComparisons / 3, 1)'
      notes:
        - 'Tracks three multi-indicator observations across products'
        - 'Documented differences are not directly represented in current events'
  - code: M.A3.5
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        productionAwarePurchases:
          anyOf:
            - PROCESSING_NOVA_CHECKED
            - PROCESSING_GREENSCORE_CHECKED
            - PROCESSING_PRODUCTION_METHOD_CHECKED
            - PROCESSING_INDICATORS_COMPARED
          distinctBy: metadata.productId
      target: 'productionAwarePurchases >= 5'
      progress: 'min(productionAwarePurchases / 5, 1)'
      notes:
        - 'Counts purchases where at least one production-related indicator was checked'
  - code: M.A4.1
    shape: composite_threshold
    rule:
      window:
        type: since_start
        days: 7
      counters:
        materialObservations:
          event: PACKAGING_MATERIAL_OBSERVED
          distinctBy: metadata.productId
        endOfLifeChecks:
          event: PACKAGING_RECYCLING_LABEL_READ
          distinctBy: metadata.productId
      target: 'materialObservations >= 3 && endOfLifeChecks >= 3'
      progress: '(min(materialObservations / 3, 1) + min(endOfLifeChecks / 3, 1)) / 2'
      notes:
        - 'Represents considering packaging material and end-of-life for at least three purchases'
  - code: M.A4.2
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        reusableChoices:
          event: PACKAGING_REUSABLE_SPOT_CHOSEN
      target: 'reusableChoices >= 5'
      progress: 'min(reusableChoices / 5, 1)'
      notes:
        - 'Direct mapping to reusable/refill occasions'
  - code: M.A4.3
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        packagingTradeoffObservations:
          event: PACKAGING_COMPARISON_MADE
          distinctBy: metadata.productId
      target: 'packagingTradeoffObservations >= 5'
      progress: 'min(packagingTradeoffObservations / 5, 1)'
      notes:
        - 'Uses explicit packaging comparisons as proxy for trade-off reflection on five products'
  - code: M.A4.4
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        smartPackagingFindings:
          event: PACKAGING_SMART_OBSERVED
          distinctBy: metadata.productId
      target: 'smartPackagingFindings >= 2'
      progress: 'min(smartPackagingFindings / 2, 1)'
      notes:
        - 'Maps to identifying at least two packaging innovations'
  - code: M.A4.5
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        packagingAwarePurchases:
          anyOf:
            - PACKAGING_MATERIAL_OBSERVED
            - PACKAGING_RECYCLING_LABEL_READ
            - PACKAGING_REUSABLE_SPOT_CHOSEN
            - PACKAGING_RECYCLABILITY_EVALUATED
          distinctBy: metadata.productId
      target: 'packagingAwarePurchases >= 5'
      progress: 'min(packagingAwarePurchases / 5, 1)'
      notes:
        - 'Captures repeated use of packaging criteria in purchase decisions'
  - code: M.A5.1
    shape: undecided
  - code: M.A5.2
