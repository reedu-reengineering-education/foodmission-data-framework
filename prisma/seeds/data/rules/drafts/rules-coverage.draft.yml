challenges:
  - code: CH.A1.1
    shape: one_shot_event
    rule:
      window:
        type: since_start
        days: 7
      counters:
        ancientGrainActions:
          event: MEAL_ANCIENT_GRAIN
          distinctBy: metadata.mealId
      target: 'ancientGrainActions >= 1'
      progress: 'min(ancientGrainActions, 1)'
      notes:
        - 'One-shot completion based on trying an ancient grain'
  - code: CH.A1.2
    shape: composite_threshold
    rule:
      window:
        type: since_start
        days: 7
      counters:
        legumeMeals:
          event: MEAL_LEGUME_CONSUMED
          distinctBy: metadata.mealId
        alternativeStapleMeals:
          event: MEAL_ALTERNATIVE_STAPLE
          distinctBy: metadata.mealId
        meatMeals:
          event: MEAL_MEAT_CONSUMED
          distinctBy: metadata.mealId
      target: 'legumeMeals >= 1 && alternativeStapleMeals >= 1 && meatMeals <= 1'
      progress: '(min(legumeMeals, 1) + min(alternativeStapleMeals, 1) + max(0, min(1 - meatMeals, 1))) / 3'
      notes:
        - 'Captures menu composition constraints from challenge task'
  - code: CH.A1.3
    shape: one_shot_event
    rule:
      window:
        type: since_start
        days: 7
      counters:
        recipeShares:
          event: LEARNING_RECIPE_SHARED
      target: 'recipeShares >= 1'
      progress: 'min(recipeShares, 1)'
      notes:
        - 'Self-attested challenge directly mapped to existing learning event'
  - code: CH.A1.4
    shape: one_shot_event
    rule:
      window:
        type: since_start
        days: 7
      counters:
        factReads:
          event: LEARNING_FACT_READ
          where:
            metadata.foodFactCode: FF1.3.7
      target: 'factReads >= 1'
      progress: 'min(factReads, 1)'
      notes:
        - 'Requires reading the quest-linked soil-fertility food fact (FF1.3.7)'
  - code: CH.A1.5
    shape: one_shot_event
    rule:
      window:
        type: since_start
        days: 7
      counters:
        footprintComparisons:
          event: LEARNING_FOOTPRINT_COMPARED
      target: 'footprintComparisons >= 1'
      progress: 'min(footprintComparisons, 1)'
      notes:
        - 'Uses comparison event as evidence for ranking/impact exploration'
  - code: CH.A2.1
    shape: composite_threshold
    rule:
      window:
        type: since_start
        days: 7
      counters:
        seasonalProduct:
          event: SHOPPING_SEASONAL_CHOSEN
        localProduct:
          event: SHOPPING_LOCAL_CHOSEN
        certifiedProduct:
          event: SHOPPING_CERTIFICATION_CHOSEN
        lowerCarbonProteinSource:
          anyOf:
            - SWAP_BEEF_TO_CHICKEN
            - SWAP_BEEF_TO_LEGUMES
            - SWAP_PORK_TO_CHICKEN
            - SWAP_PORK_TO_LEGUMES
            - SWAP_CHICKEN_TO_LEGUMES
            - SWAP_PROCESSED_MEAT_TO_LEGUMES
      target: 'seasonalProduct >= 1 && localProduct >= 1 && certifiedProduct >= 1 && lowerCarbonProteinSource >= 1'
      progress: '(min(seasonalProduct, 1) + min(localProduct, 1) + min(certifiedProduct, 1) + min(lowerCarbonProteinSource, 1)) / 4'
      notes:
        - 'Composes the four basket elements as one-shot evidences'
        - 'Hypothetical basket intent is approximated by observed choice events'
  - code: CH.A2.2
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        footprintComparisons:
          event: LEARNING_FOOTPRINT_COMPARED
      target: 'footprintComparisons >= 4'
      progress: 'min(footprintComparisons / 4, 1)'
      notes:
        - 'Uses comparison actions as proxy for ranking four foods by land use'
        - 'No land-use specific event dimension exists yet'
  - code: CH.A2.3
    shape: one_shot_event
    rule:
      window:
        type: since_start
        days: 7
      counters:
        sustainabilityFactReads:
          event: LEARNING_FACT_READ
          where:
            metadata.foodFactCode: FF2.1.8
      target: 'sustainabilityFactReads >= 1'
      progress: 'min(sustainabilityFactReads, 1)'
      notes:
        - 'Requires reading one specific water-footprint-related food fact (FF2.1.8)'
  - code: CH.A2.4
    shape: count_at_least
    rule:
      window:
        type: since_start
        days: 7
      counters:
        certificationChoices:
          event: SHOPPING_CERTIFICATION_CHOSEN
      target: 'certificationChoices >= 2'
      progress: 'min(certificationChoices / 2, 1)'
      notes:
        - 'Approximates comparing two certifications through repeated certified-product checks'
        - 'Cannot yet verify explicit comparison outcome without dedicated event/metadata'
  - code: CH.A2.5
    shape: composite_threshold
    rule:
      window:
        type: since_start
        days: 7
      counters:
        multiCriteriaReflection:
          event: SHOPPING_MULTICRITERIA_PURCHASE
        impactExploration:
          event: LEARNING_FOOTPRINT_COMPARED
      target: 'multiCriteriaReflection >= 1 && impactExploration >= 1'
      progress: '(min(multiCriteriaReflection, 1) + min(impactExploration, 1)) / 2'
      notes:
        - 'Combines decision event and impact exploration as evidence for multidimensional reflection'
  - code: CH.A3.1
    shape: composite_threshold
    rule:
      window:
        type: since_start
        days: 7
      counters:
        indicatorComparison:
          event: PROCESSING_INDICATORS_COMPARED
        ingredientReview:
          event: PROCESSING_INGREDIENTS_REVIEWED
      target: 'indicatorComparison >= 1 && ingredientReview >= 1'
      progress: '(min(indicatorComparison, 1) + min(ingredientReview, 1)) / 2'
      notes:
        - 'One-shot reflection evidence using indicator comparison plus ingredient inspection'
        - 'Challenge wording likely intends to question one-indicator sufficiency'
  - code: CH.A3.2
    shape: composite_threshold
    rule:
      window:
        type: since_start
        days: 7
      counters:
        novaCheck:
          event: PROCESSING_NOVA_CHECKED
        ingredientReview:
          event: PROCESSING_INGREDIENTS_REVIEWED
      target: 'novaCheck >= 1 && ingredientReview >= 1'
      progress: '(min(novaCheck, 1) + min(ingredientReview, 1)) / 2'
      notes:
        - 'Captures the NOVA-versus-ingredients comparison for one product'
  - code: CH.A3.3
    shape: composite_threshold
    rule:
      window:
        type: since_start
        days: 7
      counters:
        productionMethodCheck:
          event: PROCESSING_PRODUCTION_METHOD_CHECKED
        ingredientReview:
          event: PROCESSING_INGREDIENTS_REVIEWED
        packagingCheck:
          event: SHOPPING_PACKAGING_INFO_CHECKED
      target: 'productionMethodCheck >= 1 && ingredientReview >= 1 && packagingCheck >= 1'
      progress: '(min(productionMethodCheck, 1) + min(ingredientReview, 1) + min(packagingCheck, 1)) / 3'
      notes:
        - 'Approximates analyzing convenience, shelf-life and broader processing impacts'
  - code: CH.A3.4
    shape: one_shot_event
    rule:
      window:
        type: since_start
